<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="favicon-32.png" type="image/png">

<title>Actividades Alcanse</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra de marca + pestañas; vista de celular primero: tarjetas de actividad con su estado (hecha, pendiente, vencida) y formatos de conteo como tablas de captura. */
:root{
  --bg:#f2f6f8; --surface:#ffffff; --surface-2:#e8f1f6; --ink:#16232a; --ink-2:#545556; --muted:#6d777c; --line:#d7e1e6;
  --azul:#009acb; --azul-ink:#00789f; --azul-soft:#d9f0f8; --amarillo:#ffb500; --amarillo-soft:#fff1cc;
  --good:#1d8657; --good-soft:#dcf2e7; --bad:#c0402c; --bad-soft:#fae3de; --warn:#a86a10; --warn-soft:#fbecd2;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d161b; --surface:#142128; --surface-2:#1a2c35; --ink:#e5edf1; --ink-2:#b4bdc2; --muted:#8a959c; --line:#253740;
  --azul:#1db3e3; --azul-ink:#5ccaee; --azul-soft:#123848; --amarillo:#ffb500; --amarillo-soft:#3a2f12;
  --good:#4fc78f; --good-soft:#163628; --bad:#f07c66; --bad-soft:#3d1f1a; --warn:#f2b552; --warn-soft:#3a2c14; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d161b; --surface:#142128; --surface-2:#1a2c35; --ink:#e5edf1; --ink-2:#b4bdc2; --muted:#8a959c; --line:#253740;
  --azul:#1db3e3; --azul-ink:#5ccaee; --azul-soft:#123848; --amarillo:#ffb500; --amarillo-soft:#3a2f12;
  --good:#4fc78f; --good-soft:#163628; --bad:#f07c66; --bad-soft:#3d1f1a; --warn:#f2b552; --warn-soft:#3a2c14; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
.hora-auto{background:var(--surface-2,#eef2f5);font-weight:600;display:flex;align-items:center;min-height:42px;cursor:default}
.inst{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.inst-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.inst-in img{border-radius:10px;flex:none}
.inst-t{display:flex;flex-direction:column;flex:1 1 200px;min-width:0;font-size:.88rem;color:var(--ink-2,#545556)}
.inst-t b{color:var(--ink,#222);font-size:.95rem}

html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.55rem;font-weight:700}
h3{font-size:1.2rem;font-weight:700}
h4{font-size:1.05rem;font-weight:600;font-family:var(--f-body)}
p{margin:0}
a{color:var(--azul-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px;border-radius:6px}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right}

.brand{background:var(--surface);border-bottom:1px solid var(--line)}
.stripe{height:5px;background:linear-gradient(90deg,var(--azul) 0 72%,var(--amarillo) 72% 100%)}
.top{max-width:1040px;margin:0 auto;padding:12px 16px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 8px;display:flex}
.logo img{height:34px;display:block}
.ttl{flex:1 1 200px;min-width:0}
.ttl h1{font-size:1.6rem;line-height:1.1}
.ttl p{color:var(--ink-2);font-size:.88rem}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.85rem;color:var(--ink-2)}
.who b{color:var(--ink);font-weight:600}
nav.tabs{max-width:1040px;margin:0 auto;padding:8px 10px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 12px;text-decoration:none;color:var(--ink-2);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs a[aria-current="page"]{color:var(--azul-ink);border-bottom-color:var(--azul)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.75rem;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
main{max-width:1040px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
.sync{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--good)}.sync.warn::before{background:var(--warn)}.sync.off::before{background:var(--bad)}
footer{max-width:1040px;margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:.8rem;text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.lede{color:var(--ink-2);max-width:68ch}
.note{color:var(--muted);font-size:.85rem;max-width:72ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h .note{margin-left:auto}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--azul)}
.btn.danger{color:#c0402c;border-color:#e8b4aa}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.pri:hover{background:var(--azul-ink)}
.btn.dang{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sel,input.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
textarea.in{min-height:70px;resize:vertical}
label.fl,div.fl{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--ink-2)}

.alerta{border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;border:1px solid}
.alerta.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.alerta.ok{background:var(--good-soft);border-color:var(--good)}
.alerta.warn{background:var(--warn-soft);border-color:var(--warn)}
.alerta b{font-family:var(--f-display);font-size:1.15rem}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile span{display:block;color:var(--ink-2);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tile b{font-family:var(--f-display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.tile.bad b{color:var(--bad)}.tile.good b{color:var(--good)}

.list{display:flex;flex-direction:column;gap:8px}
.act{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.act.st-ok{border-left-color:var(--good)}.act.st-tarde{border-left-color:var(--warn)}.act.st-vencida{border-left-color:var(--bad)}.act.st-hoy{border-left-color:var(--amarillo)}.act.st-abierta{border-left-color:var(--azul)}
.act-main{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:3px}
.meta{color:var(--ink-2);font-size:.85rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.act-side{display:flex;gap:8px;align-items:center}
.pill{border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.tarde{background:var(--warn-soft);color:var(--warn)}.pill.vencida{background:var(--bad-soft);color:var(--bad)}
.pill.hoy{background:var(--amarillo-soft);color:var(--warn)}.pill.abierta{background:var(--azul-soft);color:var(--azul-ink)}.pill.futura{background:var(--surface-2);color:var(--ink-2)}
.chip{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:.75rem;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--ink-2);text-align:center}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--surface-2);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:var(--amarillo-soft)}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--azul-soft)}
td.dif-n{color:var(--bad);font-weight:700}td.dif-p{color:var(--warn);font-weight:700}td.dif-0{color:var(--good)}
.cap td input{width:100%;min-width:64px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);text-align:right;font-variant-numeric:tabular-nums;min-height:38px}
.cap td select{width:100%;min-width:140px;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--surface);min-height:38px}

.grid{display:grid;gap:3px;align-items:center}
.dot{width:100%;aspect-ratio:1;min-width:14px;border-radius:4px;background:var(--surface-2);border:0;padding:0;cursor:pointer}
.dot.ok{background:var(--good)}.dot.tarde{background:var(--amarillo)}.dot.vencida{background:var(--bad)}.dot.hoy,.dot.abierta{background:var(--azul-soft);outline:2px solid var(--azul);outline-offset:-2px}.dot.na{background:var(--surface-2);opacity:.45;cursor:default}
.gl{font-size:.8rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.gh{font-size:.68rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.ov{position:fixed;inset:0;background:rgba(10,20,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.sheet{background:var(--surface);width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.ov{align-items:center;padding:20px}.sheet{border-radius:16px}}
.sheet>*{flex-shrink:0}
.sheet-h{display:flex;gap:10px;align-items:flex-start}
.sheet-h div{flex:1;min-width:0}
.msg{border-radius:8px;padding:8px 12px;font-size:.88rem;font-weight:600}
.msg.ok{background:var(--good-soft);color:var(--good)}.msg.err{background:var(--bad-soft);color:var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.slogan{font-style:italic;color:var(--muted);text-align:center;font-size:.85rem}
.chk{display:flex;gap:6px;flex-wrap:wrap}
.chk label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.82rem;cursor:pointer;background:var(--surface)}
.cat td input.in,.cat td select.sel{min-height:34px;padding:5px 7px;font-size:.88rem}
.juego{border-top:4px solid var(--amarillo)}
.jg-n .nivel{font-size:1.1rem;padding:6px 14px}
.tile b small{font-size:.95rem;color:var(--muted);font-weight:600}
.nivel{display:inline-block;border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:700;border:1px solid}
.nv-diamante{background:var(--azul-soft);color:var(--azul-ink);border-color:var(--azul)}
.nv-oro{background:var(--amarillo-soft);color:var(--warn);border-color:var(--amarillo)}
.nv-plata{background:var(--surface-2);color:var(--ink-2);border-color:#a9b4ba}
.nv-bronce{background:#f6e7dc;color:#8a4b22;border-color:#c98a5e}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.badge-i{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.badge-i b{font-size:.92rem;color:var(--ink-2)}
.badge-i span{font-size:.8rem}
.badge-i.got{border:1px solid var(--good);background:var(--good-soft);color:var(--good)}
.badge-i.got b{color:var(--ink)}
.podio{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.pod.p1{border-top:5px solid var(--amarillo)}.pod.p2{border-top:5px solid #a9b4ba}.pod.p3{border-top:5px solid #c98a5e}
.pod strong{font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums}
.pod.yo,tr.yo td{background:var(--azul-soft)}
.pos{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.m-oro{background:var(--amarillo);color:#3a2a00}.m-plata{background:#8f9aa0}.m-bronce{background:#b87333}
.cj-box{border:1px solid var(--line);border-top:4px solid var(--azul);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.cj-box .cap td input{min-width:70px}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;opacity:0}
.adj{border:1px dashed var(--azul);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--azul-soft)}
.adj-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.adj-i{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.cj-det{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.cj-det summary{cursor:pointer;font-weight:600;color:var(--azul)}
.rol-cal{border-collapse:collapse;font-size:.8rem}.rol-cal th{font-weight:600;color:var(--ink-2);padding:4px 2px;text-align:center;min-width:26px}.rol-cal th:first-child,.rol-cal td:first-child{text-align:left;padding-right:10px;white-space:nowrap;position:sticky;left:0;background:var(--surface,#fff)}
.rol-cal th.fin{color:var(--azul)}.rol-cal td{padding:2px;text-align:center}
.rc{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2,#eef2f5);font-weight:700;font-size:.75rem;cursor:pointer;display:inline-block;color:var(--ink-2)}
i.rc{width:16px;height:16px;vertical-align:middle;cursor:default}
.rc.cen{background:#d6eff8;color:#006f93;border-color:#9fd6ea}.rc.cua{background:#fff1cc;color:#8a5a00;border-color:#ffd677}.rc.des{background:#eceeef;color:#7b7d7e}
.chk{font-size:.82rem;display:inline-flex;gap:4px;align-items:center}
.rc.st{background:#fff;color:#9a9c9d;border-style:dashed}
.rc.rc-ov{outline:2px solid var(--ink,#222);outline-offset:-2px}
.rol-pat select{min-width:92px;max-width:118px}.sel.sm{padding:4px 6px;font-size:.82rem}
.card.aud-bad{border-color:#e8b4aa;background:#fffaf8}
.in:disabled,.sel:disabled{background:#f4f6f8;color:var(--ink,#16232a);cursor:default}
.acc-mis{border-color:#ffd677;background:#fffbf0}.acc-it{display:flex;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 0;flex-wrap:wrap}.acc-it>div:first-child{flex:1 1 260px}.acc-r{flex:1 1 100%}
.acc-fil .fl{flex:1 1 160px}
.acc-f{padding-top:10px}
.link-box{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--azul);text-decoration:underline;background:#f4f6f8}
.aud-it{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.aud-it.no{background:#fdf1ee;margin:0 -12px;padding:10px 12px}
.aud-l{font-weight:600;font-size:.92rem}.aud-x{grid-column:1/-1;display:flex;gap:8px}.aud-x .in{flex:1}
.aud-fs{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}.aud-fs img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#f4f6f8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg-b{border:0;background:var(--surface,#fff);padding:7px 11px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink-2);border-left:1px solid var(--line)}.seg-b:first-child{border-left:0}
.seg-b.on.si{background:#dff3e8;color:#1d8657}.seg-b.on.no{background:#f9dcd6;color:#c0402c}.seg-b.on.na{background:#eceeef;color:#545556}
.aud-res .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.aud-res .kpi{display:flex;flex-direction:column}.aud-res .kpi span{font-size:.78rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}.aud-res .kpi b{font-size:1.5rem}
.aud-res b.good{color:#1d8657}.aud-res b.warn{color:#a86a10}.aud-res b.bad{color:#c0402c}
@media(max-width:640px){.aud-it{grid-template-columns:1fr}}
.adj-prev{flex:1 0 100%;display:block;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:center;min-height:60px}
.adj-prev img{display:block;width:100%;max-height:420px;object-fit:contain;background:#f4f6f8}
.adj-t{font-size:.72rem;font-weight:700;background:var(--azul);color:#fff;border-radius:5px;padding:2px 6px}
.adj-n{flex:1 1 140px;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:.9rem}
.hint-scroll{display:none}
@media (max-width:560px){.hint-scroll{display:block}.cap td input{min-width:54px}.who{align-items:flex-start;width:100%}.ttl h1{font-size:1.4rem}th,td{padding:7px 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<header class="brand"><div class="stripe"></div>
  <div class="top">
    <span class="logo"><img id="logo" alt="Alcanse Motos y Empeños"></span>
    <div class="ttl"><h1>Actividades del equipo</h1><p>Funciones y reportes por puesto · Suc. Centro y Suc. Cuauhtémoc</p></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</header>
<div id="instalar" class="inst" hidden role="region" aria-label="Instalar aplicación"><div class="inst-in"><img src="icon-192.png" alt="" width="40" height="40"><div class="inst-t"><b>Instala Actividades Alcanse</b><span id="instTx">Ábrela desde un ícono en tu celular o computadora, como una app.</span></div><button class="btn pri sm" type="button" id="instBtn">Instalar</button><button class="btn sm" type="button" id="instNo" aria-label="Ahora no">Ahora no</button></div></div>
<main id="main"><div class="card"><p class="lede">Cargando actividades…</p></div></main>
<footer id="foot"></footer>

function periodos(act,a,b){
  const out=[];const A=dia0(a),B=new Date(b.getFullYear(),b.getMonth(),b.getDate(),23,59,59);
  if(act.frec==='dias'){const D=(act.dias||[]).map(Number);for(let d=new Date(A);d<=B;d=addD(d,1))if(D.includes(dow(d)))out.push({per:iso(d),ini:new Date(d),lim:at(d,act.hora)})}
  else if(act.frec==='diario'){for(let d=new Date(A);d<=B;d=addD(d,1))out.push({per:iso(d),ini:new Date(d),lim:at(d,act.hora)})}
  else if(act.frec==='semanal'){for(let m=lunes(addD(A,-7));m<=B;m=addD(m,7)){const lim=at(addD(m,(num(act.dia)||1)-1),act.hora);if(lim>=A&&lim<=B)out.push({per:'S'+iso(m),ini:new Date(m),lim})}}
  else{
    let k=prevMes(mesOf(A));const fin=mesOf(B);
    while(k<=fin){const[y,m]=k.split('-').map(Number);const ld=lastDay(y,m);
      const cand=act.frec==='quincenal'
        ?[{per:'Q'+k+'-1',ini:new Date(y,m-1,1),lim:at(new Date(y,m-1,15),act.hora)},{per:'Q'+k+'-2',ini:new Date(y,m-1,16),lim:at(new Date(y,m-1,ld),act.hora)}]
        :[{per:'M'+k,ini:new Date(y,m-1,1),lim:at(new Date(y,m-1,Math.min(num(act.dia)||ld,ld)),act.hora)}];
      cand.forEach(p=>{if(p.lim>=A&&p.lim<=B)out.push(p)});k=nextMes(k)}
  }
  return out;
}
function lugarDe(col,d,R){if(!col)return'';R=R||S.roles||{};const k=iso(d);const m=((R.meses||{})[k.slice(0,7)]||{})[col.id];if(m&&m[k])return m[k];
  const pt=(R.patron||{})[col.id];const w=dow(d);if(pt&&pt[w])return pt[w];if((col.descanso||[]).map(Number).includes(w))return'Descanso';return col.suc||''}
const NO_TRABAJA=v=>v==='Descanso'||v==='Sin turno';
function cubrePuestos(col,R){R=R||S.roles||{};return((R.cubre||{})[col.id])||[]}
function actsCubre(col){const cp=cubrePuestos(col);if(!cp.length)return[];return cfgActs().filter(a=>a.activo!==false&&a.cubre&&!(a.puestos||[]).includes(col.puesto)&&(a.puestos||[]).some(p=>cp.includes(p)))}
function responsable(act,lug,d){const dd=iso(d);const act0=c=>c.activo!==false&&!(c.desde&&c.desde>dd)&&lugarDe(c,d)===lug;
  const C=cfgCols().filter(c=>act0(c)&&(act.puestos||[]).includes(c.puesto));
  if(C.length){const t=C.find(c=>c.suc===lug);return(t||C[0]).id}
  const K=cfgCols().filter(c=>act0(c)&&cubrePuestos(c).some(p=>(act.puestos||[]).includes(p)));return K.length?K[0].id:null}
function instancias(col,a,b){
  const res=[];const desde=col.desde?D0(col.desde):null;
  const AJ=actById('conteo_joyeria');
  for(const act of actsDe(col).concat(actsCubre(col))){
    const diaFijo=act.frec==='diario'||act.frec==='dias'||act.frec==='semanal';
    for(const p of periodos(act,a,b)){
      if(desde&&p.lim<desde)continue;
      let lug=col.suc||'';const dd=dia0(p.lim);
      if(diaFijo&&!act.porSuc){lug=lugarDe(col,dd);
        if(NO_TRABAJA(lug)){if(act.frec==='semanal'&&!act.cubre)lug=col.suc||'';else continue}
        if(act.cubre&&responsable(act,lug,dd)!==col.id)continue}
      let sucs=act.porSuc?SUCS:[null];
      if(act.porSuc&&diaFijo){if(NO_TRABAJA(lugarDe(col,dd)))continue;if(act.tipo==='validar'&&AJ)sucs=sucs.filter(su=>responsable(AJ,su,dd)!==col.id)}
      for(const s of sucs){const key=act.id+'__'+p.per+(s?'__'+SUCC[s]:'');
        res.push({key,act,per:p.per,suc:s||lug||'',porSuc:!!s,ini:p.ini,lim:p.lim,mes:mesOf(p.lim),col:col.id})}
    }
  }
  res.sort((x,y)=>x.lim-y.lim||String(x.act.nombre).localeCompare(y.act.nombre));
  res.forEach(i=>{S.inst[i.col+'~'+i.key]=i});
  return res;
}

const esFormato=t=>t==='joyeria'||t==='piso'||t==='inventario';
const conPdf=t=>esFormato(t)||t==='caja';
function estado(inst,rec,now){
  if(hecho(rec))return new Date(rec.at)<=inst.lim?'ok':'tarde';
  if(now>inst.lim)return'vencida';
  if(now>=inst.ini)return iso(inst.lim)===iso(now)?'hoy':'abierta';
  return'futura';
}
function buildIdx(){
  const idx={};S.rows.forEach(r=>{if(!r||!r.data)return;(idx[r.colab]=idx[r.colab]||{})[r.key]=Object.assign({},r.data,{colab:r.colab,key:r.key,mes:r.mes,uid:r.user_id})});
  const v={};S.vrows.forEach(r=>{if(r&&r.data&&r.data.ok)v[r.colab+'~'+r.key]=r.data});
  S.idx=idx;S.vidx=v;
}
function statsMes(col,mes,now){
  const[y,m]=mes.split('-').map(Number);const a=new Date(y,m-1,1),b=new Date(y,m-1,lastDay(y,m));
  const L=instancias(col,a,b);const R=S.idx[col.id]||{};const o={ok:0,tarde:0,vencida:0,pend:0,total:0,lista:L};
  L.forEach(i=>{const st=estado(i,R[i.key],now);if(st==='ok')o.ok++;else if(st==='tarde')o.tarde++;else if(st==='vencida')o.vencida++;else o.pend++});
  o.total=o.ok+o.tarde+o.vencida;o.pct=o.total?(o.ok+o.tarde)/o.total:NaN;o.pctT=o.total?o.ok/o.total:NaN;return o;
}
function ventana(col,now){
  const hoy=dia0(now);const L=instancias(col,addD(hoy,-14),addD(hoy,45));const R=S.idx[col.id]||{};
  const venc=L.filter(i=>i.lim<now&&!hecho(R[i.key])).sort((x,y)=>y.lim-x.lim);
  const deHoy=L.filter(i=>iso(i.lim)===iso(hoy)&&!(i.lim<now&&!hecho(R[i.key])));
  const fin=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate(),23,59,59);
  const prox=L.filter(i=>i.lim>fin&&i.ini<=now);
  const sig=L.filter(i=>i.lim>fin&&i.ini>now&&i.act.frec!=='diario'&&i.ini<=addD(hoy,7));
  const todoHoy=L.filter(i=>iso(i.lim)===iso(hoy));const hechasHoy=todoHoy.filter(i=>hecho(R[i.key])).length;
  return{venc,deHoy,prox,sig,R,todoHoy,hechasHoy};
}

function errText(e){

  if(/banned|User is banned/i.test(m))return'Tu usuario está desactivado. Habla con Dirección.';
  if(e&&(e.code==='42501'||/row-level security|permission denied/i.test(m)))return'No tienes permiso para guardar esto.';
  if(e&&e.code==='P0001'&&m)return m;
  if(/Failed to fetch|NetworkError|network/i.test(m))return'Sin conexión. Revisa tu internet y vuelve a intentar.';
  if(/Password should be|password/i.test(m)&&/6/.test(m))return'La contraseña debe tener al menos 6 caracteres.';
  return m?('No se pudo guardar: '+m):'No se pudo guardar. Revisa tu conexión y vuelve a intentar.';
}

function miEquipoSuc(me){if(!me||me.puesto!=='enc')return[];return cfgCols().filter(c=>c.activo!==false&&c.id!==me.id&&(c.puesto==='caj'||c.puesto==='val')&&(!c.suc||c.suc===me.suc))}

function porValidar(me,now){const hoy=dia0(now);const out=[];if(!me||me.puesto!=='enc')return out;const ok=(c,r)=>hecho(r)&&!S.vidx[c.id+'~'+r.key]&&new Date(r.at)>=addD(hoy,-14);

const PTS={ok:10,tarde:5,exacto:5};
const NIVELES=[['Diamante',0.95],['Oro',0.85],['Plata',0.70],['Bronce',0]];
function nivelDe(p){if(!isFinite(p))return null;return NIVELES.find(([,m])=>p>=m)[0]}
function rachaDe(col,now){
  const hoy=dia0(now);const desde=col.desde?D0(col.desde):addD(hoy,-90);const ini=desde>addD(hoy,-90)?desde:addD(hoy,-90);
  const L=instancias(col,ini,hoy).filter(i=>esDiaria(i.act));const R=S.idx[col.id]||{};const por={};
  L.forEach(i=>{(por[iso(i.lim)]=por[iso(i.lim)]||[]).push(estado(i,R[i.key],now))});
  let n=0;for(let d=new Date(hoy);d>=ini;d=addD(d,-1)){const E=por[iso(d)];if(!E)continue;
    if(E.every(e=>e==='ok')){n++;continue}
    if(iso(d)===iso(hoy)&&E.every(e=>e==='ok'||e==='hoy'||e==='abierta'||e==='futura'))continue;
    break}
  return n;
}
function juego(col,mes,now){
  const s=statsMes(col,mes,now);const R=S.idx[col.id]||{};let pts=0,max=0,exactos=0,conteos=0,temprano=0;
  s.lista.forEach(i=>{const st=estado(i,R[i.key],now);if(st!=='ok'&&st!=='tarde'&&st!=='vencida')return;const r=R[i.key];
    max+=PTS.ok;if(st==='ok')pts+=PTS.ok;else if(st==='tarde')pts+=PTS.tarde;
    if(i.act.tipo==='joyeria'||i.act.tipo==='piso'){max+=PTS.exacto;if(r){conteos++;if(!totConteo(i.act.tipo,r.datos||{}).difs){pts+=PTS.exacto;exactos++}}}
    if(r&&st==='ok'&&i.lim-new Date(r.at)>=3600000)temprano++});
  const pct=max?pts/max:NaN;const racha=mes===mesOf(now)?rachaDe(col,now):0;
  const ins=[
    {k:'perfecta',n:'Semana perfecta',d:'7 días seguidos con todas las actividades diarias a tiempo',ok:racha>=7,p:`${Math.min(racha,7)}/7 días`},
    {k:'limpio',n:'Mes sin pendientes',d:'Ninguna actividad sin registrar en el mes (mínimo 10)',ok:s.total>=10&&s.vencida===0,p:s.vencida?`${s.vencida} sin registrar`:`${s.total}/10 actividades`},
    {k:'exacto',n:'Inventario exacto',d:'5 conteos sin ninguna diferencia contra SIDEM',ok:exactos>=5,p:`${Math.min(exactos,5)}/5 conteos`,solo:'conteo'},

  const tieneConteo=actsDe(col).some(a=>a.tipo==='joyeria'||a.tipo==='piso');
  return{pts,max,pct,nivel:nivelDe(pct),racha,ins:ins.filter(x=>x.solo!=='conteo'||tieneConteo),s,exactos,conteos};
}

/* ============ conteos ============ */
function conteosMes(mes){
  const out=[];for(const[cid,R] of Object.entries(S.idx))for(const r of Object.values(R)){
    const a=actById(r.act);const tipo=r.tipo||(a&&a.tipo);if(!esFormato(tipo)||!hecho(r))continue;if(r.mes!==mes)continue;
    const t=tipo==='inventario'?totInv(r.datos||{}):totConteo(tipo,r.datos||{});out.push({r,tipo,cid,col:colById(cid),t,val:S.vidx[cid+'~'+r.key]||null})}
  return out.sort((a,b)=>String(b.r.per).localeCompare(String(a.r.per))||String(a.r.suc).localeCompare(b.r.suc));
}
function conteosDia(per,suc){
  const out=[];for(const[cid,R] of Object.entries(S.idx))for(const tipo of ['joyeria','piso']){const id=tipo==='joyeria'?'conteo_joyeria':'conteo_piso';const r=R[id+'__'+per];
    if(r&&r.suc===suc)out.push({cid,tipo,r,val:S.vidx[cid+'~'+r.key]||null})}
  return out;
}
function totConteo(tipo,d){
  const rows=tipo==='joyeria'?JOYAS:PISO;const t={s:0,f:0,p:0,o:0,dif:0,difs:0};
  rows.forEach(([k])=>{const x=(d.rows||{})[k]||{};const s=num(x.s),f=tipo==='joyeria'?num(x.p)+num(x.o):num(x.f);t.s+=s;t.f+=f;t.p+=num(x.p);t.o+=num(x.o);if(f-s!==0)t.difs++});
  t.dif=t.f-t.s;return t;
}
function vConteos(){
  const now=ahora();const mes=S.mesSel||mesOf(now);const me=meCol();const mgr=esMgr();
  let L=conteosMes(mes);if(!mgr&&me)L=L.filter(x=>x.cid===me.id);if(S.fSuc!=='Todas')L=L.filter(x=>x.r.suc===S.fSuc);
  const nDif=L.filter(x=>x.t.difs).length;
  return`<div class="sec-h"><h2>Conteos de inventario</h2><span class="note">Joyería almacén venta y piso de venta</span></div>
  <div class="row"><label class="fl" for="mesSel" style="flex-direction:row;align-items:center;gap:8px">Mes<select class="sel" id="mesSel" style="width:auto">${mesesOpts().map(k=>`<option value="${k}" ${k===mes?'selected':''}>${mesLabel(k)}</option>`).join('')}</select></label>
  <label class="fl" for="fSuc" style="flex-direction:row;align-items:center;gap:8px">Sucursal<select class="sel" id="fSuc" style="width:auto">${['Todas',...SUCS].map(s=>`<option ${s===S.fSuc?'selected':''}>${s}</option>`).join('')}</select></label></div>
  <div class="tiles"><div class="tile"><span>Conteos</span><b>${L.length}</b></div><div class="tile ${nDif?'bad':'good'}"><span>Con diferencias</span><b>${nDif}</b></div><div class="tile"><span>Por validar</span><b>${L.filter(x=>!x.val).length}</b></div></div>
  ${L.length?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Formato</th><th>Sucursal</th><th>Responsable</th><th class="n">SIDEM</th><th class="n">Físico</th><th class="n">Diferencia</th><th>Validación</th><th>Formato</th></tr></thead><tbody>
  ${L.map(x=>`<tr class="clk" data-open="${esc(x.cid+'~'+x.r.key)}" tabindex="0"><td>${fCorta(new Date(x.r.at))}</td><td>${x.tipo==='joyeria'?'Joyería':(x.tipo==='piso'?'Piso de venta':esc(x.r.nombre||'Inventario'))}</td><td>${esc(x.r.suc)}</td><td>${esc(x.col?nombreCorto(x.col):'')}</td>${x.tipo==='inventario'?`<td class="n">—</td><td class="n">—</td><td class="n ${x.t.difs?'dif-p':'dif-0'}">${x.t.difs?x.t.difs+' con dif.':'Sin dif.'}</td>`:`<td class="n">${x.t.s}</td><td class="n">${x.t.f}</td><td class="n ${x.t.dif<0?'dif-n':(x.t.dif>0?'dif-p':(x.t.difs?'dif-p':'dif-0'))}">${x.t.dif>0?'+':''}${x.t.dif}${x.t.difs&&!x.t.dif?' (por línea)':''}</td>`}<td>${x.val?`<span class="pill ok">Validado</span>`:'<span class="pill hoy">Por validar</span>'}</td><td><button class="btn sm" type="button" data-pdf="${esc(x.cid+'~'+x.r.key)}">PDF</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay conteos registrados en este mes.</div>'}
  <p class="note">Diferencia = físico − SIDEM. Negativa: faltan prendas o artículos; positiva: hay de más (posible duplicado o error de sistema).</p>${mgr?reportesCoord(mes):''}`;
}
function reportesCoord(mes){
  const acts=cfgActs().filter(a=>a.valCoord&&a.activo!==false);if(!acts.length)return'';const ids=new Set(acts.map(a=>a.id));
  let L=[];cfgCols().forEach(c=>Object.values(S.idx[c.id]||{}).forEach(r=>{if(ids.has(r.act)&&hecho(r)&&r.mes===mes)L.push({c,r,val:S.vidx[c.id+'~'+r.key]})}));
  if(S.fSuc!=='Todas')L=L.filter(x=>(x.r.suc||x.c.suc)===S.fSuc);L.sort((a,b)=>String(b.r.at).localeCompare(String(a.r.at)));
  const pend=L.filter(x=>!x.val).length;
  return`<div class="sec-h" style="margin-top:22px"><h2>Reportes por validar</h2><span class="note">${acts.map(a=>esc(a.nombre)).join(' · ')}${pend?` · <b>${pend} pendiente${pend===1?'':'s'}</b>`:''}</span></div>
  ${L.length?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Reporte</th><th>Sucursal</th><th>Responsable</th><th>Registrado</th><th class="n">Evidencias</th><th>Validación</th><th>PDF</th></tr></thead><tbody>
  ${L.map(x=>{const lim=x.r.lim?new Date(x.r.lim):null;const at=new Date(x.r.at);const tarde=lim&&at>lim;const n=((x.r.datos||{}).archivos||[]).length;
    return`<tr class="clk" data-open="${esc(x.c.id+'~'+x.r.key)}" tabindex="0"><td>${fCorta(lim||at)}</td><td>${esc(x.r.nombre||(actById(x.r.act)||{}).nombre||'')}</td><td>${esc(x.r.suc||x.c.suc||'')}</td><td>${esc(nombreCorto(x.c))}</td><td>${fHora(at)}${tarde?' <span class="pill tarde">Tarde</span>':''}</td><td class="n">${n||'<span class="pill vencida">0</span>'}</td><td>${x.val?`<span class="pill ok">Validado</span> <span class="note">${esc(x.val.nombre||'')}</span>`:'<span class="pill hoy">Por validar</span>'}</td><td><button class="btn sm" type="button" data-pdf="${esc(x.c.id+'~'+x.r.key)}">PDF</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="card"><p class="note">Sin reportes registrados en este mes.</p></div>'}`;
}

    <td style="min-width:220px">${pChk(a,i)}</td>

function parseCampos(s){return String(s||'').split(',').map(x=>x.trim()).filter(Boolean).map((x,j)=>{let t='txt',l=x;if(/#$/.test(x)){t='num';l=x.slice(0,-1).trim()}else if(/\$$/.test(x)){t='money';l=x.slice(0,-1).trim()}else if(/@$/.test(x)){t='url';l=x.slice(0,-1).trim()}return{k:'c'+(j+1),l,t}})}
function bindCatalogo(){
  $$('[data-ca]').forEach(el=>{const ev=el.type==='checkbox'||el.tagName==='SELECT'?'change':'input';el.addEventListener(ev,()=>{const a=S.draftCat[+el.dataset.ca];const f=el.dataset.f;
    if(f==='dias'){const s=new Set((a.dias||[]).map(Number));el.checked?s.add(+el.value):s.delete(+el.value);a.dias=[...s]}
    else if(f==='puesto'){const s=new Set(a.puestos||[]);el.checked?s.add(el.value):s.delete(el.value);a.puestos=[...s]}
    else if(f==='hora'){if(el.value&&el.value>HORA_MAX){el.value=HORA_MAX;flash('cat','err','El horario máximo de las actividades es a las 6:00 p. m.')}a.hora=el.value}
    else if(f==='porSuc'||f==='activo')a[f]=el.checked;
    else if(f==='campos')a.campos=parseCampos(el.value);
    else if(f==='cajas')a.cajas=String(el.value).split('\n').map(x=>x.trim()).filter(Boolean);
    else if(f==='filas'){a.filas=a.filas||{};a.filas[el.dataset.suc]=String(el.value).split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(x=>x[0]).map(([l,lin,sub,pr,sem],j)=>({id:j+1,l,lin:lin&&lin!=='Todos'?lin:'',sub:sub&&sub!=='Todos'?sub:'',pr:pr&&pr!=='N/A'?pr:'',sem:sem||''}))}
    else if(f==='dia')a.dia=num(el.value)||'';
    else{a[f]=el.value;if(f==='frec'||f==='tipo'){if(f==='frec'&&a.frec==='semanal'&&!a.dia)a.dia=1;render()}}})});
  $$('[data-ce]').forEach(el=>{const ev=el.type==='checkbox'||el.tagName==='SELECT'||el.type==='date'?'change':'input';el.addEventListener(ev,()=>{const c=S.draftEq[+el.dataset.ce];const f=el.dataset.f;
    if(f==='descanso'){const s=new Set((c.descanso||[]).map(Number));el.checked?s.add(+el.value):s.delete(+el.value);c.descanso=[...s].sort()}
    else if(f==='activo')c.activo=el.checked;else c[f]=el.value})});
  const aa=$('#addAct');if(aa)aa.onclick=()=>{S.draftCat.push({id:'a'+Date.now().toString(36),nombre:'Nueva actividad',desc:'',puestos:[],frec:'diario',hora:'18:00',tipo:'check',porSuc:false,activo:true,orden:S.draftCat.length+1});render()};
  const ac=$('#addCol');if(ac)ac.onclick=()=>{S.draftEq.push({id:'c'+Date.now().toString(36),nombre:'Nuevo colaborador',corto:'',puesto:'caj',suc:'Centro',descanso:[],desde:iso(addD(ahora(),1)),activo:true});render()};
  const sc=$('#saveCat');if(sc)sc.onclick=async()=>{const bad=S.draftCat.find(a=>!String(a.nombre).trim()||!(a.puestos||[]).length);if(bad){flash('cat','err',`"${bad.nombre||'Sin nombre'}" necesita nombre y al menos un puesto.`);return}
    const{error}=await S.sb.from('config').upsert({id:'catalogo',data:{acts:S.draftCat},actualizado:ahora().toISOString()});if(error){flash('cat','err',errText(error));return}S.catalogo={acts:JSON.parse(JSON.stringify(S.draftCat))};flash('cat','ok','Actividades guardadas.')};
  const se=$('#saveEq');if(se)se.onclick=async()=>{const{error}=await S.sb.from('config').upsert({id:'equipo',data:{cols:S.draftEq},actualizado:ahora().toISOString()});if(error){flash('eqc','err',errText(error));return}S.equipo={cols:JSON.parse(JSON.stringify(S.draftEq))};flash('eqc','ok','Equipo guardado.')};
}

  const[cid,key]=[k.slice(0,k.indexOf('~')),k.slice(k.indexOf('~')+1)];
  let inst=S.inst[k];const rec=(S.idx[cid]||{})[key];
  if(!inst&&rec){const a=actById(rec.act)||{id:rec.act,nombre:rec.nombre,frec:'diario',tipo:rec.tipo||'check'};inst={key,act:a,per:rec.per,suc:rec.suc,porSuc:!!(a.porSuc),ini:new Date(rec.lim),lim:new Date(rec.lim),mes:rec.mes,col:cid}}
  if(!inst)return;
  S.modal={k,cid,key,inst,ini:fHora(ahora()),files:[],keep:null};render();
}

async function comprimir(f){

  try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));if(!bl||bl.size>=f.size)return f;
    return new File([bl],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})}catch(e){return f}
}

  AT(doc,{startY:y,head:[['Colaborador','Puesto','A tiempo','Tarde','No realizadas','Cumplimiento','Puntos','Nivel']],body:S2.map(({c,s,g})=>[c.nombre,(PUESTOS[c.puesto]||c.puesto)+(c.suc?' '+c.suc:''),s.ok,s.tarde,s.vencida,p0(s.pct),g.max?`${g.pts}/${g.max}`:'—',g.nivel||'—']),
    columnStyles:{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}}});
  S2.forEach(({c,s})=>{const R=S.idx[c.id]||{};const L=s.lista.filter(i=>estado(i,R[i.key],now)==='vencida');if(!L.length)return;
    y=lastY(doc)+18;if(y>680){doc.addPage();y=50}doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...AZ);doc.text(`NO REALIZADAS · ${c.nombre.toUpperCase()}`,36,y);
    AT(doc,{startY:y+6,head:[['Actividad','Límite']],body:L.map(i=>[i.act.nombre+(i.porSuc?' · '+i.suc:''),`${fCorta(i.lim)} ${fHora(i.lim)}`]),columnStyles:{1:{cellWidth:120}}})});
  pdfFoot(doc);guardarArchivo(`Cumplimiento de actividades ${mesLabel(mes)}.pdf`,doc,'eq');
  }catch(e){flash('eq','err','No se pudo generar el PDF: '+e.message)}
}

init();
</script>

<script>
(function(){
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(function(){});
  if(standalone||window.top!==window)return;
  var bar=document.getElementById('instalar'),btn=document.getElementById('instBtn'),no=document.getElementById('instNo'),tx=document.getElementById('instTx');
  if(!bar)return;var evt=null;
  function oculto(){try{return Date.now()<+(localStorage.getItem('instNo')||0)}catch(e){return false}}
  var ua=navigator.userAgent||'';var ios=/iphone|ipad|ipod/i.test(ua)||(/macintosh/i.test(ua)&&navigator.maxTouchPoints>1);
  function mostrar(){if(!oculto())bar.hidden=false}
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();evt=e;mostrar()});
  window.addEventListener('appinstalled',function(){bar.hidden=true});
  if(ios){tx.textContent='En Safari toca Compartir (el cuadro con flecha hacia arriba) y luego "Agregar a pantalla de inicio".';btn.textContent='Cómo instalar';mostrar()}
  var android=/android/i.test(ua);
  if(!ios)setTimeout(function(){if(evt||!bar.hidden)return;btn.textContent='Cómo instalar';mostrar()},3500);
  function pasos(){if(android)return'1. Si estás dentro de otra app (WhatsApp, Facebook, Claude), toca <b>⋮</b> y elige <b>Abrir en Chrome</b>.<br>2. En Chrome toca <b>⋮</b> (arriba a la derecha).<br>3. Elige <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.';
    return'1. Abre esta página en <b>Chrome</b> o <b>Edge</b>.<br>2. Toca el ícono de instalar al lado derecho de la barra de direcciones, o el menú <b>⋮</b> → <b>Instalar Actividades Alcanse</b>.'}
  btn.onclick=function(){if(evt){evt.prompt();evt.userChoice.then(function(){evt=null;bar.hidden=true})}else if(ios){tx.innerHTML='1. Abre esta página en <b>Safari</b>.<br>2. Toca <b>Compartir</b> (cuadro con flecha ↑).<br>3. Elige <b>Agregar a pantalla de inicio</b> y toca <b>Agregar</b>.';btn.hidden=true}else{tx.innerHTML=pasos();btn.hidden=true}};
  no.onclick=function(){bar.hidden=true;try{localStorage.setItem('instNo',String(Date.now()+7*864e5))}catch(e){}};
})();
</script>
